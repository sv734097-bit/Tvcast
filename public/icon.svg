<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer TV bezel -->
  <rect x="64" y="96" width="384" height="256" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  
  <!-- Screen glass -->
  <rect x="84" y="116" width="344" height="216" rx="16" fill="url(#screen)"/>
  
  <!-- Android TV D-Pad & Play Symbol -->
  <polygon points="232,190 232,260 296,225" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.3))"/>
  
  <!-- USB Cable Connector Icon bottom left -->
  <path d="M120 290 L160 290 M140 270 L140 310" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- TV Stand Base -->
  <path d="M220 352 L200 400 L312 400 L292 352 Z" fill="#334155"/>
  <rect x="176" y="400" width="160" height="16" rx="8" fill="#475569"/>

  <!-- Top Antennas / Broadcast waves -->
  <path d="M220 96 L180 56 M292 96 L332 56" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
</svg>
